<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44" role="img" aria-label="Motif kain tapis Lampung">
  <defs>
    <pattern id="tapis" width="80" height="44" patternUnits="userSpaceOnUse">
      <rect width="80" height="44" fill="#D2A03D"/>

      <!-- garis tepi atas & bawah -->
      <rect width="80" height="2" fill="#14213D"/>
      <rect y="42" width="80" height="2" fill="#14213D"/>

      <!-- tumpal atas -->
      <path d="M0 2h20L10 10z" fill="#14213D"/>
      <path d="M20 2h20L30 10z" fill="#7C1F2C"/>
      <path d="M40 2h20L50 10z" fill="#14213D"/>
      <path d="M60 2h20L70 10z" fill="#7C1F2C"/>
      <g fill="#EFE3C2">
        <circle cx="10" cy="5.4" r="1.25"/>
        <circle cx="30" cy="5.4" r="1.25"/>
        <circle cx="50" cy="5.4" r="1.25"/>
        <circle cx="70" cy="5.4" r="1.25"/>
      </g>
      <rect y="10" width="80" height="1" fill="#7C1F2C"/>

      <!-- deret belah ketupat kecil -->
      <g>
        <path d="M5 11.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M15 11.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M25 11.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M35 11.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M45 11.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M55 11.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M65 11.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M75 11.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
      </g>
      <rect y="15.5" width="80" height="1" fill="#14213D"/>

      <!-- pita tengah: motif roset & penghubung -->
      <rect y="16.5" width="80" height="11" fill="#C4922F"/>
      <rect y="16.5" width="80" height="0.8" fill="#14213D"/>
      <rect y="26.7" width="80" height="0.8" fill="#14213D"/>

      <path d="M0 18.5L5 22L0 25.5z" fill="#14213D"/>
      <path d="M80 18.5L75 22L80 25.5z" fill="#14213D"/>
      <circle cx="2" cy="22" r="0.9" fill="#C43A46"/>
      <circle cx="78" cy="22" r="0.9" fill="#C43A46"/>

      <path d="M40 16.8L62 22L40 27.2L18 22z" fill="#7C1F2C" stroke="#14213D" stroke-width="0.9"/>
      <path d="M40 18.7L54 22L40 25.3L26 22z" fill="#EFE3C2"/>
      <path d="M40 20.2L46 22L40 23.8L34 22z" fill="#14213D"/>
      <circle cx="40" cy="22" r="0.9" fill="#C43A46"/>

      <rect y="27.5" width="80" height="1" fill="#14213D"/>

      <!-- deret belah ketupat kecil (bawah) -->
      <g>
        <path d="M5 29.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M15 29.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M25 29.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M35 29.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M45 29.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M55 29.5l2 2-2 2-2-2z" fill="#14213D"/>
        <path d="M65 29.5l2 2-2 2-2-2z" fill="#EFE3C2"/>
        <path d="M75 29.5l2 2-2 2-2-2z" fill="#14213D"/>
      </g>
      <rect y="33.5" width="80" height="1" fill="#7C1F2C"/>

      <!-- tumpal bawah -->
      <path d="M0 42L10 34l10 8z" fill="#7C1F2C"/>
      <path d="M20 42L30 34l10 8z" fill="#14213D"/>
      <path d="M40 42L50 34l10 8z" fill="#7C1F2C"/>
      <path d="M60 42L70 34l10 8z" fill="#14213D"/>
      <g fill="#EFE3C2">
        <circle cx="10" cy="38.6" r="1.25"/>
        <circle cx="30" cy="38.6" r="1.25"/>
        <circle cx="50" cy="38.6" r="1.25"/>
        <circle cx="70" cy="38.6" r="1.25"/>
      </g>
    </pattern>
  </defs>

  <rect width="240" height="44" fill="url(#tapis)"/>
</svg>
